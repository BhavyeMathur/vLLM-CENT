name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check --editable ".[dev]"
      - name: Lint
        run: ruff check --output-format=github src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Type check
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check --editable ".[dev]"
      - name: Run tests with branch coverage
        run: coverage run -m unittest discover -s tests
      - name: Write coverage reports
        if: ${{ !cancelled() }}
        run: |
          coverage xml --fail-under=0
          coverage html --fail-under=0
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce coverage threshold
        if: ${{ !cancelled() }}
        run: coverage report
