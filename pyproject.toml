[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-cent"
version = "0.0.0"
description = "A vLLM integration and compiler interface for CENT."
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.10,<8",
    "mypy>=1.18,<2",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "D202",
    "SIM117",
    "UP040",
    "UP042",
]
select = [
    "ANN",
    "B",
    "C4",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "N",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

# These lowering modules reassign narrow inferred values to sibling union
# members. Keep every other strict mypy check active while that code is refined.
[[tool.mypy.overrides]]
module = [
    "vllm_cent.lowering.transformer.attention",
    "vllm_cent.models.llama.attention",
    "vllm_cent.models.llama.feed_forward",
]
disable_error_code = ["assignment"]

[tool.coverage.run]
branch = true
source = ["vllm_cent"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
